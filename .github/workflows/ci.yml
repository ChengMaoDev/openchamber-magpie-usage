name: Validate extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run package
      - run: bun run verify:npm
      - name: Check committed bundles
        run: git diff --exit-code -- panel service
      - uses: actions/upload-artifact@v4
        with:
          name: openchamber-magpie-usage
          path: release/*
